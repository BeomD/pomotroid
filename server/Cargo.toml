[package]
name = "pomotroid-server"
version = "1.7.1"
description = "Pomotroid web server — server-side Pomodoro timer with SQLite persistence"
authors = ["Pomotroid contributors"]
edition = "2021"

[[bin]]
name = "pomotroid-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
